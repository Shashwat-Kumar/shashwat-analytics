name: Agora weekly debate

# Every Tuesday at 10:30 IST the house AI personas hold a new debate, which is
# published to readsigil.com/agora. Needs one repository secret: GEMINI_API_KEY
# (Google AI Studio) or GROQ_API_KEY (console.groq.com); both have free tiers.
# Without either, the run is skipped with a warning.
on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id from the agora repo's data/topics.json (leave empty for the next unused topic)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  debate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Shashwat-Kumar/agora
          path: _agora
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the debate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGORA_MODEL: ${{ vars.AGORA_MODEL }}
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY" ]; then
            echo "::warning::No model key set. Add GEMINI_API_KEY or GROQ_API_KEY under Settings > Secrets and variables > Actions. Skipping this run."
            exit 0
          fi
          # Pick the first provider whose key answers (Gemini, then Groq) and a model it actually serves.
          CHOICE=$(python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          UA = "agora-orchestrator/0.1"
          # Preference order: instruction-tuned chat models first; reasoning models last (they spend tokens thinking).
          GROQ_PREFS = ["meta-llama/llama-4-maverick-17b-128e-instruct", "moonshotai/kimi-k2-instruct-0905",
                        "moonshotai/kimi-k2-instruct", "llama-3.3-70b-versatile", "meta-llama/llama-4-scout-17b-16e-instruct",
                        "qwen/qwen3-32b", "openai/gpt-oss-120b", "openai/gpt-oss-20b"]
          SKIP = ("whisper", "guard", "tts", "playai", "distil", "prompt", "compound", "allam")

          def call(base, key, path, body=None):
              req = urllib.request.Request(base + path, data=None if body is None else json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json", "Authorization": "Bearer " + key,
                                                    "User-Agent": UA})
              return json.loads(urllib.request.urlopen(req, timeout=60).read() or b"{}")

          def groq_models(base, key):
              have = [m["id"] for m in call(base, key, "/models").get("data", [])]
              ranked = [m for m in GROQ_PREFS if m in have]
              ranked += [m for m in have if m not in ranked and not any(x in m.lower() for x in SKIP)]
              print("::notice::Groq models available: " + ", ".join(have), file=sys.stderr)
              return ranked

          options = [("gemini", "GEMINI_API_KEY", "https://generativelanguage.googleapis.com/v1beta/openai"),
                     ("groq", "GROQ_API_KEY", "https://api.groq.com/openai/v1")]
          for name, key_env, base in options:
              key = os.environ.get(key_env)
              if not key:
                  continue
              try:
                  models = [os.environ["AGORA_MODEL"]] if os.environ.get("AGORA_MODEL") else (
                      ["gemini-flash-latest"] if name == "gemini" else groq_models(base, key))
                  for model in models[:4]:
                      try:
                          call(base, key, "/chat/completions", {"model": model, "max_tokens": 20,
                               "messages": [{"role": "user", "content": "Reply with OK"}]})
                          print(name, model)
                          sys.exit(0)
                      except urllib.error.HTTPError as e:
                          msg = e.read()[:300].decode(errors="replace").replace("\n", " ")
                          print(f"::warning::{name}/{model} check failed: HTTP {e.code}: {msg}", file=sys.stderr)
              except urllib.error.HTTPError as e:
                  msg = e.read()[:300].decode(errors="replace").replace("\n", " ")
                  print(f"::warning::{name} check failed: HTTP {e.code}: {msg}", file=sys.stderr)
              except (urllib.error.URLError, OSError) as e:
                  print(f"::warning::{name} check failed: {e}", file=sys.stderr)
          print("::error::No model provider accepted its key. See the warnings above.", file=sys.stderr)
          sys.exit(1)
          PY
          ) || exit 1
          PROVIDER=${CHOICE%% *}
          export AGORA_MODEL=${CHOICE#* }
          case "$AGORA_MODEL" in
            openai/gpt-oss*) export AGORA_EXTRA='{"reasoning_effort": "low"}' ;;
            qwen/*) export AGORA_EXTRA='{"reasoning_effort": "none"}' ;;
          esac
          echo "::notice::Debate running on $PROVIDER / $AGORA_MODEL"
          echo "Provider: $PROVIDER"
          T="${TOPIC:-$(python scripts/build_agora.py --next-topic _agora/data/topics.json)}"
          echo "Topic: $T"
          mkdir -p _out
          if ! (cd _agora && python -m agora.cli run --provider "$PROVIDER" --turns 24 --topic "$T" --out ../_out) 2> _err.txt; then
            echo "::error::Debate run failed: $(tail -c 700 _err.txt | tr '\n' ' ')"
            exit 1
          fi
          python scripts/build_agora.py _out/*.json

      - name: Publish
        run: |
          git config user.name "agora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agora sitemap.xml
          if git diff --cached --quiet; then echo "Nothing new to publish."; exit 0; fi
          git commit -m "Agora: new live debate"
          git pull --rebase --quiet
          git push
