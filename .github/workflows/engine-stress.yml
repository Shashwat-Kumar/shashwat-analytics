name: Engine reliability (manual)

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Fresh page starts per engine
        default: '10'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - env:
          BROWSER: ${{ matrix.browser }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=localhost -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -days 1 2>/dev/null
          python tests/workshops/serve_https.py 8443 "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" >/dev/null 2>&1 &
          sleep 2
          python tests/workshops/engine_stress.py
