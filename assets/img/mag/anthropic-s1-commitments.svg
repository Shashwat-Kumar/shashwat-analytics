<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Anthropic S-1: demand and commitments</title><desc id="desc">Split editorial graphic contrasting first-half 2026 revenue of 16.3 billion dollars and separate multi-year minimum cloud spending commitments of 269.4 billion dollars, not a like-for-like ratio.</desc><rect width="1200" height="750" fill="#101b22"/><rect x="30" y="35" width="1140" height="680" rx="12" fill="#162832"/><path d="M600 100V640" stroke="#78939a" stroke-width="2" stroke-dasharray="6 10"/><g font-family="Arial,Helvetica,sans-serif"><text x="95" y="155" fill="#a7e6d3" font-size="29" letter-spacing="5">DEMAND · H1 2026</text><text x="95" y="365" fill="#fff" font-size="114" font-weight="bold">$16.3B</text><text x="95" y="438" fill="#d6e3e4" font-size="31">Revenue</text><text x="95" y="501" fill="#86c9c0" font-size="25">80% usage-based</text><text x="645" y="155" fill="#eeb59d" font-size="29" letter-spacing="3">COMMITMENTS · MULTI-YEAR</text><text x="645" y="365" fill="#fff" font-size="103" font-weight="bold">$269.4B</text><text x="645" y="438" fill="#d6e3e4" font-size="29">Minimum cloud spend</text><text x="645" y="501" fill="#eeb59d" font-size="23">AWS · Google · Microsoft</text><text x="95" y="632" fill="#bdcacc" font-size="22">Different time horizons. Do not compare these as a ratio.</text><text x="95" y="683" fill="#829ca4" font-size="19">READSIGIL / THE SIGNAL   ·   SOURCE: ANTHROPIC FORM S-1, 26 OCT 2026</text></g></svg>