<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Two bar charts. Commands per hour: a typical human operator up to 40, an ARTEX-driven intrusion more than 1,500. Agentic adversary attacks seen by CrowdStrike: about 45 in September 2026 and 126 in October as of 30 October."><rect width="1200" height="675" fill="#0a0f0f"/><style>text{font-family:Inter,Helvetica,Arial,sans-serif;fill:#e9ecea}.s{fill:#9aa5a1}.m{font-family:"JetBrains Mono",Menlo,monospace}</style><text x="60" y="70" font-size="34" font-weight="700">Agent-run intrusions move at machine speed</text><text class="s" x="60" y="110" font-size="20">Figures given by CrowdStrike. Left: commands per hour. Right: agentic adversary attacks observed.</text><text x="60" y="165" font-size="22" font-weight="700">Commands per hour</text><rect x="110" y="516" width="150" height="9" rx="4" fill="#12b886" fill-opacity="0.9"/><text class="m" x="185" y="504" font-size="24" font-weight="700" text-anchor="middle">40</text><text class="s" x="185" y="555" font-size="17" text-anchor="middle">Human operator</text><text class="s" x="185" y="577" font-size="15" text-anchor="middle">(typical, up to)</text><rect x="340" y="200" width="150" height="325" rx="4" fill="#ff6a3d" fill-opacity="0.9"/><text class="m" x="415" y="188" font-size="24" font-weight="700" text-anchor="middle">1,500+</text><text class="s" x="415" y="555" font-size="17" text-anchor="middle">ARTEX-driven</text><text class="s" x="415" y="577" font-size="15" text-anchor="middle">(can exceed)</text><line x1="600" y1="150" x2="600" y2="600" stroke="#ffffff" stroke-opacity="0.15"/><text x="660" y="165" font-size="22" font-weight="700">Agentic adversary attacks</text><rect x="710" y="412" width="150" height="112" rx="4" fill="#e8aa6a" fill-opacity="0.9"/><text class="m" x="785" y="400" font-size="24" font-weight="700" text-anchor="middle">~45</text><text class="s" x="785" y="555" font-size="17" text-anchor="middle">September 2026</text><rect x="940" y="210" width="150" height="315" rx="4" fill="#ff6a3d" fill-opacity="0.9"/><text class="m" x="1015" y="198" font-size="24" font-weight="700" text-anchor="middle">126</text><text class="s" x="1015" y="555" font-size="17" text-anchor="middle">October 2026</text><text class="s" x="1015" y="577" font-size="15" text-anchor="middle">(to 30 Oct, still rising)</text><text class="s" x="60" y="635" font-size="16">Source: CrowdStrike&#x27;s Adam Meyers and CrowdStrike data, quoted by CyberScoop, 30 Oct 2026 (cyberscoop.com). October is a partial month.</text><text class="s" x="60" y="659" font-size="16">Chart: The Signal, Issue 04 · readsigil.com</text></svg>