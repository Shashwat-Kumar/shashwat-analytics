<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Bar chart of BCG's 2026 benchmark of 26 systemically important banks: 92% piloting or permitting agentic AI, 73% permitting agents in production for select uses, 54% with restrictions or prohibitions on agents in their risk appetite, 46% reporting an AI-related issue or incident in the past 12 months, 8% with a comprehensive monitoring and control framework covering agents, and 0% permitting broad production use."><rect width="1200" height="675" fill="#0b1413"/><text x="60" y="70" font-family="Inter,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#ffffff">Agents are in production. Agent controls are not</text><text x="60" y="108" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#9aa5a1">Share of 26 systemically important banks, BCG benchmark 2026</text><text x="60" y="168" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#d8e0dd">Piloting or permitting agentic AI</text><rect x="60" y="180" width="760" height="26" rx="5" fill="#ffffff" fill-opacity="0.06"/><rect x="60" y="180" width="699" height="26" rx="5" fill="#12b886"/><text x="773" y="201" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff">92%</text><text x="60" y="248" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#d8e0dd">Permit agents in production (select uses)</text><rect x="60" y="260" width="760" height="26" rx="5" fill="#ffffff" fill-opacity="0.06"/><rect x="60" y="260" width="555" height="26" rx="5" fill="#12b886"/><text x="629" y="281" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff">73%</text><text x="60" y="328" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#d8e0dd">Restrictions or prohibitions on agents in risk appetite</text><rect x="60" y="340" width="760" height="26" rx="5" fill="#ffffff" fill-opacity="0.06"/><rect x="60" y="340" width="410" height="26" rx="5" fill="#e8aa6a"/><text x="484" y="361" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff">54%</text><text x="60" y="408" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#d8e0dd">Reported an AI-related issue or incident (12 months)</text><rect x="60" y="420" width="760" height="26" rx="5" fill="#ffffff" fill-opacity="0.06"/><rect x="60" y="420" width="350" height="26" rx="5" fill="#e8aa6a"/><text x="424" y="441" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff">46%</text><text x="60" y="488" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#d8e0dd">Comprehensive monitoring and control framework covering agents</text><rect x="60" y="500" width="760" height="26" rx="5" fill="#ffffff" fill-opacity="0.06"/><rect x="60" y="500" width="61" height="26" rx="5" fill="#ff6a3d"/><text x="135" y="521" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff">8%</text><text x="60" y="568" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#d8e0dd">Permit broad production use of agents</text><rect x="60" y="580" width="760" height="26" rx="5" fill="#ffffff" fill-opacity="0.06"/><text x="74" y="601" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff">0%</text><text x="60" y="650" font-family="Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#9aa5a1">Source: BCG, AI Safety and Governance in Banking 2026, press release, 13 Nov 2026. Chart: ReadSigil / The Signal.</text></svg>